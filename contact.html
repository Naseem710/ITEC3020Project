<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Naseem Mohsin</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js" defer></script>

  <style>
    #contact-form { max-width: 560px; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="nav-wrap">
      <a href="index.html" class="logo">Naseem Mohsin</a>
      <nav><ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="resume.html">Resume</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul></nav>
      <button id="theme-toggle" aria-label="Toggle dark mode">Dark Mode</button>
    </div>
  </header>

  <main class="container">
    <div class="page-header">
      <h1>Get in Touch</h1>
      <p class="intro-text">Have a question? Please feel free to reach out!</p>
    </div>

    <section>
      <form id="contact-form" action="#" method="post">
        <div class="form-field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-field">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject">
        </div>

        <div class="form-field">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Send Message</button>
      </form>

      <h2 style="margin-top: 3rem;">Find me on</h2>
      <!-- Links include the 3 apps I use the most -->
      <div class="social-links">
        <a href="https://www.linkedin.com/in/naseem-mohsin-b5aa8b271/">LinkedIn</a>
        <a href="https://github.com/Naseem710" >GitHub</a>
        <a href="https://www.instagram.com/naseem_710/" >Instagram</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-wrap">

      </div>
    </div>
  </footer>
</body>
</html>
