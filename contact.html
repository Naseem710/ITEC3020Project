<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Naseem Mohsin</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js" defer></script>
  <script src="js/components.js" defer></script>

  <style>
    #contact-form { max-width: 560px; }
  </style>
</head>
<body>

  <div id="header-placeholder"></div>

  <main class="container">
    <div class="page-header">
      <h1>Get in Touch</h1>
      <p class="intro-text">Have a question? Please feel free to reach out!</p>
    </div>

    <section>
      <form id="contact-form" action="#" method="post">
        <div class="form-field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-field">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject">
        </div>

        <div class="form-field">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Send Message</button>
      </form>

      <h2 style="margin-top: 3rem;">Find me on</h2>
      <!-- Links include the 3 apps I use the most -->
      <div class="social-links">
        <a href="https://www.linkedin.com/in/naseem-mohsin-b5aa8b271/">LinkedIn</a>
        <a href="https://github.com/Naseem710" >GitHub</a>
        <a href="https://www.instagram.com/naseem_710/" >Instagram</a>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>
</body>
</html>
