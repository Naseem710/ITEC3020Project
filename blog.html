<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naseem Mohisn's Blog</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js" defer></script>
  <script src="js/components.js" defer></script>
  <script src="js/blog.js" defer></script>
  <script src="js/filter.js" defer></script>
</head>
<body>

  <div id="header-placeholder"></div>

  <main class="container">
    <div class="page-header">
      <h1>Blog</h1>
      <p class="intro-text">
        Welcome to my blog page. Here is where I will be sharing my updates on my life, projects I'm working on, what I'm learning, or just my thoughts.</p>
    </div>

    <div class="filter-bar">
      <input type="text" id="filter-input" placeholder="Search posts by title or category…">
    </div>

    <section id="blog-list" class="grid">
    </section>

    <p id="no-results">No posts found.</p>
  </main>

  <div id="footer-placeholder"></div>
</body>
</html>
